<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { width: 270px; margin: 0; padding: 14px; font: 13px system-ui, "Segoe UI", sans-serif; background: #0e1218; color: #e6edf3; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .st { color: #8b98a5; margin: 10px 0; line-height: 1.45; }
  .st b { color: #5fe0b0; }
  button { width: 100%; padding: 8px; border: 1px solid #2a3440; border-radius: 9px; background: #151b23; color: #e6edf3; cursor: pointer; }
  .sw { position: relative; width: 42px; height: 24px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw i { position: absolute; inset: 0; border-radius: 12px; background: #2a3440; transition: .15s; }
  .sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
  .sw input:checked + i { background: #2f9e78; }
  .sw input:checked + i::after { left: 21px; }
</style>
</head>
<body>
  <h1>AWG Pilot для Chrome</h1>
  <div class="row"><span id="label">Выключено</span><label class="sw"><input id="on" type="checkbox"><i></i></label></div>
  <div id="st" class="st"></div>
  <button id="opts">Настройки</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
